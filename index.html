<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xylem memory</title>
<meta name="description" content="Cross-project view of context-keeper entries, cambium pages and quality gaps.">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xylem">
<!-- ?v= is a cache buster, and it is not optional. Without it a browser that has
     seen this page once keeps serving the old app.css/app.js after every UI
     change: the page renders as a mix of new markup and stale styles, which
     looks like the dashboard is broken. BUMP THIS on any change to app.css or
     app.js, and bump SHELL in sw.js to match. -->
<link rel="stylesheet" href="app.css?v=20">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="masthead">
      <h1>Xylem memory</h1>
      <p class="sub" id="subtitle">Loading snapshot…</p>
    </div>

    <!-- The four numbers the whole mesh reduces to. Above the fold, nothing
         competing: everything below is progressive disclosure. -->
    <div class="kpis" id="kpis"></div>
  </div>
</header>

<div class="wrap">
  <div id="banners"></div>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" data-view="lessons" aria-selected="true">What we've learned<span class="n" id="n-lessons"></span></button>
    <button class="tab" role="tab" data-view="projects" aria-selected="false">Projects<span class="n" id="n-projects"></span></button>
    <button class="tab" role="tab" data-view="chains" aria-selected="false">Supersession<span class="n" id="n-chains"></span></button>
    <button class="tab" role="tab" data-view="pages" aria-selected="false">Pages<span class="n" id="n-pages"></span></button>
    <button class="tab" role="tab" data-view="links" aria-selected="false">Links<span class="n" id="n-links"></span></button>
    <button class="tab" role="tab" data-view="quality" aria-selected="false">Quality<span class="n" id="n-quality"></span></button>
  </nav>

  <main>
    <section id="view-lessons" class="view" aria-label="What we've learned"></section>
    <section id="view-projects" class="view" hidden aria-label="Projects"></section>
    <section id="view-chains" class="view" hidden aria-label="Supersession chains"></section>
    <section id="view-pages" class="view" hidden aria-label="Pages"></section>
    <section id="view-links" class="view" hidden aria-label="Proposed links"></section>
    <section id="view-quality" class="view" hidden aria-label="Quality gaps"></section>
  </main>

  <footer class="foot-note">
    <p>Built from <code>snapshot.json</code>. Regenerate with
       <code>cambium-mcp refresh --out snapshot.json --vault vault</code>.</p>
    <p id="foot-note"></p>
  </footer>
</div>

<script src="app.js?v=20"></script>
</body>
</html>
